regexTarget = "line"
paths = ['''^third_party/sing\-box/common/sniff/quic\.go$''']
regexes = ['''^\s*keyLabel\ =\ qtls\.HKDFLabelKeyV1\s*$''', '''^\s*keyLabel\ =\ qtls\.HKDFLabelKeyV2\s*$''']

